<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map | Loyable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .phone-content.map-page {
      display: flex;
      flex-direction: column;
      padding: 28px 20px 16px;
      gap: 12px;
      overflow: hidden;
    }

    .map-page .page-title {
      margin-bottom: 0;
    }

    .map-page .page-copy {
      font-size: 0.88rem;
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d8dde3;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--navy);
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--sage-btn);
    }

    .search-bar button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      background: var(--sage-btn);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .search-bar button:hover {
      background: #8a9d76;
    }

    #map {
      height: 240px;
      border-radius: 16px;
      border: 1px solid #e5ebef;
      z-index: 1;
    }

    .results-meta {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .results-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .results-list li {
      border: 1px solid #e5ebef;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .results-list li:hover,
    .results-list li.active {
      border-color: var(--sage-btn);
      background: #f6f9f4;
    }

    .results-list h3 {
      margin: 0 0 4px;
      font-size: 0.98rem;
      color: var(--navy);
    }

    .results-list p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .results-list .cuisine {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--sage);
    }

    .empty-state,
    .error-state {
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .error-state {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-frame has-nav">
      <div class="phone-content map-page">
        <h1 class="page-title">Map</h1>
        <p class="page-copy">Browse and search local restaurants in the Loyable rewards network.</p>

        <form class="search-bar" id="searchForm">
          <input id="searchInput" type="search" placeholder="Search restaurants…" autocomplete="off" />
          <button type="submit">Search</button>
        </form>

        <div id="map" aria-label="Restaurant map"></div>
        <p class="results-meta" id="resultsMeta">Loading restaurants…</p>
        <ul class="results-list" id="resultsList"></ul>
        <p class="empty-state" id="emptyState" hidden>No restaurants yet. If you are a restaurant owner, add your restaurant or refine your search.</p>
        <p class="error-state" id="errorState" hidden></p>
      </div>
      <nav class="bottom-nav" aria-label="Main"></nav>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script>
    const map = L.map("map", { zoomControl: false }).setView([29.6516, -82.3248], 13);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    let markersById = {};

    function authHeaders() {
      return { Authorization: `Bearer ${localStorage.getItem("accessToken")}` };
    }

    function renderList(items) {
      const list = document.getElementById("resultsList");
      const empty = document.getElementById("emptyState");
      const meta = document.getElementById("resultsMeta");
      list.innerHTML = "";
      markersLayer.clearLayers();
      markersById = {};

      const mappable = items.filter((r) => r.lat != null && r.lng != null);
      meta.textContent = `${items.length} spot${items.length === 1 ? "" : "s"} in the Loyable network`;
      empty.hidden = items.length > 0;

      items.forEach((r) => {
        const li = document.createElement("li");
        li.dataset.id = String(r.id);
        li.innerHTML = `
          <h3>${r.name}</h3>
          <p>${r.address || "Address coming soon"}</p>
          ${r.cuisine ? `<span class="cuisine">${r.cuisine}</span>` : ""}
        `;
        li.addEventListener("click", () => selectRestaurant(r.id));
        list.appendChild(li);

        if (r.lat != null && r.lng != null) {
          const marker = L.marker([r.lat, r.lng]).addTo(markersLayer);
          marker.bindPopup(`<strong>${r.name}</strong><br>${r.address || ""}`);
          marker.on("click", () => selectRestaurant(r.id));
          markersById[r.id] = marker;
        }
      });

      if (mappable.length) {
        const bounds = L.latLngBounds(mappable.map((r) => [r.lat, r.lng]));
        map.fitBounds(bounds.pad(0.2));
      }
    }

    function selectRestaurant(id) {
      document.querySelectorAll(".results-list li").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === String(id));
      });
      const marker = markersById[id];
      if (marker) {
        map.setView(marker.getLatLng(), 15);
        marker.openPopup();
      }
    }

    async function loadRestaurants(query = "") {
      const error = document.getElementById("errorState");
      error.hidden = true;
      document.getElementById("resultsMeta").textContent = "Loading restaurants…";

      try {
        const url = query
          ? `${API}/restaurants/discover?q=${encodeURIComponent(query)}`
          : `${API}/restaurants/discover`;
        const res = await fetch(url, { headers: authHeaders() });
        const data = await res.json().catch(() => []);
        if (!res.ok) {
          throw new Error(data.error || data.msg || "Could not load restaurants.");
        }
        renderList(data);
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        document.getElementById("resultsMeta").textContent = "";
      }
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadRestaurants(document.getElementById("searchInput").value.trim());
    });

    setTimeout(() => {
      map.invalidateSize();
      loadRestaurants();
    }, 50);
  </script>
</body>
</html>
