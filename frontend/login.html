<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Loyable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --sage-btn-hover: #8a9d76;
      --label: #3d5a4c;
      --border: #d8dde3;
    }

    .brand {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--navy);
      line-height: 1.2;
    }

    .tagline {
      margin: 10px 0 48px;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--sage);
    }

    #status {
      display: none;
      min-height: 0;
      padding: 10px 12px;
      margin: 0 0 20px;
      font-size: 0.85rem;
      border-radius: 10px;
      text-align: left;
    }

    #status.visible { display: block; }
    #status.error { color: #991b1b; background: #fee2e2; }
    #status.success { color: #166534; background: #dcfce7; }

    .auth-form {
      text-align: left;
      width: 100%;
    }

    .field {
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--label);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--navy);
      background: #fff;
      outline: none;
    }

    .field input::placeholder {
      color: #b0b8c0;
    }

    .field input:focus {
      border-color: var(--sage-btn);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      color: #9aa3ad;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      color: var(--navy);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--sage-btn);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-login:hover {
      background: var(--sage-btn-hover);
    }

    .auth-divider {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .auth-divider.visible {
      display: flex;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--navy);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-google.visible {
      display: flex;
    }

    .btn-google:hover {
      background: #f4f7f9;
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .signup-row {
      margin: 36px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    .signup-row button {
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: inherit;
      font-weight: 600;
      color: var(--sage);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .signup-row button:hover {
      color: var(--sage-btn-hover);
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="phone-content centered">
        <h1 class="brand">Loyable</h1>
        <p class="tagline">Earn rewards with every bite</p>

        <div id="status" aria-live="polite"></div>

        <button type="button" class="btn-google" id="googleBtn" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-divider" id="authDivider">or</div>

        <form id="authForm" class="auth-form">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="submitBtn">Login</button>
        </form>

        <p class="signup-row" id="switchRow">
          <span id="switchText">Don't have an account?</span>
          <button type="button" id="switchBtn">Sign up</button>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script src="app.js"></script>
  <script>
    let mode = "login";
    let auth0Client = null;
    let auth0CallbackUrl = "http://localhost:5000/login.html";

    // Auth0 callback must match Allowed Callback URLs exactly — always use localhost
    if (location.hostname === "127.0.0.1") {
      location.replace("http://localhost:5000" + location.pathname + location.search + location.hash);
    }

    function setStatus(message, isError = false) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = isError ? "error visible" : "success visible";
    }

    function clearStatus() {
      const el = document.getElementById("status");
      el.textContent = "";
      el.className = "";
    }

    function setMode(next) {
      mode = next;
      clearStatus();
      const submitBtn = document.getElementById("submitBtn");
      const switchText = document.getElementById("switchText");
      const switchBtn = document.getElementById("switchBtn");
      const password = document.getElementById("password");

      if (mode === "signup") {
        submitBtn.textContent = "Create account";
        switchText.textContent = "Already have an account?";
        switchBtn.textContent = "Log in";
        password.autocomplete = "new-password";
      } else {
        submitBtn.textContent = "Login";
        switchText.textContent = "Don't have an account?";
        switchBtn.textContent = "Sign up";
        password.autocomplete = "current-password";
      }
    }

    function getCredentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };
    }

    function finishLogin(accessToken, email) {
      localStorage.setItem("accessToken", accessToken);
      localStorage.setItem("email", email);
      setupBottomNav();
      window.location.assign("index.html");
    }

    async function loginWithCredentials(email, password) {
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token) {
        throw new Error(data.error || "Login failed.");
      }
      finishLogin(data.access_token, data.email || email);
    }

    async function exchangeAuth0Token(idToken) {
      const res = await fetch(`${API}/auth/auth0`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_token: idToken }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token) {
        throw new Error(data.error || "Auth0 login failed.");
      }
      finishLogin(data.access_token, data.email);
    }

    function redirectUri() {
      return auth0CallbackUrl;
    }

    function showGoogleLogin() {
      document.getElementById("googleBtn").classList.add("visible");
      document.getElementById("authDivider").classList.add("visible");
    }

    async function initAuth0() {
      const googleBtn = document.getElementById("googleBtn");

      try {
        const res = await fetch(`${API}/auth/auth0-config`);
        const cfg = await res.json().catch(() => ({}));
        if (!cfg.configured || !cfg.domain || !cfg.clientId) {
          return;
        }

        if (cfg.callbackUrl) {
          auth0CallbackUrl = cfg.callbackUrl;
        }

        // Show the button as soon as Auth0 is configured
        showGoogleLogin();

        if (typeof auth0 === "undefined" || !auth0.createAuth0Client) {
          throw new Error("Auth0 script failed to load. Check your network, then refresh.");
        }

        auth0Client = await auth0.createAuth0Client({
          domain: cfg.domain,
          clientId: cfg.clientId,
          authorizationParams: {
            redirect_uri: redirectUri(),
            scope: "openid profile email",
            ...(cfg.audience ? { audience: cfg.audience } : {}),
          },
          cacheLocation: "localstorage",
        });

        const params = new URLSearchParams(window.location.search);
        if (params.has("code") && params.has("state")) {
          setStatus("Finishing Google sign-in…");
          googleBtn.disabled = true;
          await auth0Client.handleRedirectCallback();
          window.history.replaceState({}, document.title, "/login.html");
          const claims = await auth0Client.getIdTokenClaims();
          if (!claims || !claims.__raw) {
            throw new Error("Could not read Auth0 ID token.");
          }
          await exchangeAuth0Token(claims.__raw);
        }
      } catch (err) {
        setStatus(err.message || "Could not start Google sign-in.", true);
        googleBtn.disabled = false;
      }
    }

    async function loginWithGoogle() {
      if (!auth0Client) {
        setStatus("Auth0 is not configured yet.", true);
        return;
      }
      setStatus("Redirecting to Google…");
      document.getElementById("googleBtn").disabled = true;
      try {
        await auth0Client.loginWithRedirect({
          authorizationParams: {
            connection: "google-oauth2",
            redirect_uri: redirectUri(),
            scope: "openid profile email",
          },
        });
      } catch (err) {
        document.getElementById("googleBtn").disabled = false;
        setStatus(err.message || "Could not open Google login.", true);
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const { email, password } = getCredentials();
      if (!email || !password) {
        setStatus("Enter an email and password first.", true);
        return;
      }

      if (mode === "signup") {
        setStatus("Creating your account…");
        try {
          const res = await fetch(`${API}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus(data.error || "Could not create account.", true);
            return;
          }
          setStatus("Account created! Signing you in…");
          await loginWithCredentials(email, password);
        } catch (err) {
          setStatus(`Network error: ${err.message}`, true);
        }
        return;
      }

      setStatus("Logging in…");
      try {
        await loginWithCredentials(email, password);
      } catch (err) {
        setStatus(err.message || "Invalid email or password.", true);
      }
    }

    document.getElementById("switchBtn").addEventListener("click", () => {
      setMode(mode === "login" ? "signup" : "login");
    });
    document.getElementById("authForm").addEventListener("submit", handleSubmit);
    document.getElementById("googleBtn").addEventListener("click", loginWithGoogle);

    document.getElementById("togglePassword").addEventListener("click", () => {
      const input = document.getElementById("password");
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      document.getElementById("togglePassword").setAttribute(
        "aria-label",
        showing ? "Show password" : "Hide password"
      );
    });

    initAuth0();
  </script>
</body>
</html>
