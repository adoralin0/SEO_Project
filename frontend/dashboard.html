<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Loyable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--muted);
    }

    .back-link:hover {
      color: var(--navy);
    }

    .dash-card {
      border: 1px solid #e5ebef;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
      background: #fafbfc;
    }

    .dash-label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dash-input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #e5ebef;
      border-radius: 12px;
      background: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--navy);
    }

    .dash-input:focus {
      outline: none;
      border-color: var(--sage-btn);
    }

    .dash-actions {
      display: flex;
      gap: 10px;
    }

    .dash-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--sage-btn);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dash-btn:hover {
      background: #8a9d76;
    }

    .dash-btn.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid #e5ebef;
    }

    .dash-btn.secondary:hover {
      background: #f4f7f9;
    }

    #status {
      min-height: 1.3em;
      margin: 0 0 8px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    #status.error {
      color: #b91c1c;
    }

    #status.success {
      color: #3d6b4f;
    }

    .auth-state {
      margin: 0 0 8px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    #restList {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
    }

    #restList li {
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid #e5ebef;
      border-radius: 12px;
      background: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--navy);
    }

    #restList:empty::after {
      content: "No restaurants yet.";
      display: block;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* styles for dashboard metrics / charts */
    .stat-note {
      margin: -8px 0 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hbar-row {
      margin-bottom: 12px;
    }

    .hbar-row:last-child {
      margin-bottom: 0;
    }

    .hbar-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.85rem;
    }

    .hbar-name {
      font-weight: 500;
      color: var(--navy);
    }

    .hbar-value {
      font-weight: 700;
      color: var(--sage-btn);
      white-space: nowrap;
    }

    .hbar-track {
      height: 10px;
      border-radius: 6px;
      background: #e5ebef;
      overflow: hidden;
    }

    .hbar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--sage-btn);
    }

    /* for "daily customers" dashboard section */
    .vbar-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 140px;
      padding-top: 20px;
    }

    .vbar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }

    .vbar-value {
      margin-bottom: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--navy);
    }

    .vbar-fill {
      width: 100%;
      max-width: 28px;
      border-radius: 6px 6px 0 0;
      background: var(--sage-btn);
    }

    .vbar-label {
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-frame has-nav">
      <div class="phone-content">
        <a class="back-link" href="profile.html">← Back to profile</a>
        <h1 class="page-title">Restaurant Dashboard</h1>
        <p class="page-copy">Add and manage the spots you own.</p>

        <p class="auth-state" id="authState"></p>
        <div id="status" aria-live="polite"></div>

        <div class="dash-card">
          <label class="dash-label" for="restName">Restaurant name</label>
          <input class="dash-input" id="restName" type="text" placeholder="e.g. Blue Fig Cafe" />

          <div class="dash-actions">
            <button type="button" class="dash-btn" id="addBtn">Add</button>
            <button type="button" class="dash-btn secondary" id="loadBtn">Load</button>
          </div>

          <ul id="restList"></ul>
        </div>

        <div class="dash-card">
          <span class="dash-label">Most popular menu items</span>
          <p class="stat-note">SAMPLE DATA</p>
          <div id="menuStats"></div>
        </div>

        <div class="dash-card">
          <span class="dash-label">Daily customer count: Last 7 days</span>
          <p class="stat-note">SAMPLE DATA</p>
          <div id="customerStats"></div>
        </div>
      </div>
      <nav class="bottom-nav" aria-label="Main"></nav>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    function accessToken() {
      return localStorage.getItem("accessToken");
    }

    function setStatus(message, isError = false) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = isError ? "error" : "success";
    }

    function showAuthState() {
      const email = localStorage.getItem("email");
      document.getElementById("authState").textContent =
        accessToken() && email ? `Signed in as ${email}` : "Not signed in.";
    }

    async function addRestaurant() {
      if (!accessToken()) {
        setStatus("Log in first", true);
        return;
      }
      const name = document.getElementById("restName").value.trim();
      if (!name) {
        setStatus("Enter a restaurant name.", true);
        return;
      }
      try {
        const res = await fetch(`${API}/restaurants/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken()}`,
          },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(`Added "${data.name}".`);
          document.getElementById("restName").value = "";
          loadRestaurants();
        } else {
          setStatus(data.error || "Could not add restaurant.", true);
        }
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    async function loadRestaurants() {
      if (!accessToken()) {
        setStatus("Log in first", true);
        return;
      }
      try {
        const res = await fetch(`${API}/restaurants/`, {
          method: "GET",
          headers: { Authorization: `Bearer ${accessToken()}` },
        });
        const data = await res.json();
        if (res.ok) {
          const list = document.getElementById("restList");
          list.textContent = "";
          data.forEach((r) => {
            const li = document.createElement("li");
            li.textContent = r.name;
            list.appendChild(li);
          });
          setStatus(
            data.length
              ? `${data.length} restaurant${data.length === 1 ? "" : "s"}`
              : ""
          );
        } else {
          setStatus(data.error || data.msg || "Could not load restaurants.", true);
        }
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    function renderFakeStats() {
      const menuItems = [
        { name: "Margherita Pizza", value: 128 },
        { name: "Caesar Salad", value: 94 },
        { name: "Spicy Chicken Sandwich", value: 81 },
        { name: "Iced Latte", value: 76 },
        { name: "Chocolate Brownie", value: 52 },
      ];

      const dailyCustomers = [
        { name: "Mon", value: 42 },
        { name: "Tue", value: 38 },
        { name: "Wed", value: 51 },
        { name: "Thu", value: 47 },
        { name: "Fri", value: 63 },
        { name: "Sat", value: 89 },
        { name: "Sun", value: 71 },
      ];

      const menuMax = Math.max(...menuItems.map((i) => i.value));
      const menuEl = document.getElementById("menuStats");
      menuItems.forEach((item) => {
        const pct = Math.round((item.value / menuMax) * 100);
        const row = document.createElement("div");
        row.className = "hbar-row";
        row.innerHTML = `
          <div class="hbar-top">
            <span class="hbar-name">${item.name}</span>
            <span class="hbar-value">${item.value}</span>
          </div>
          <div class="hbar-track"><div class="hbar-fill" style="width: ${pct}%"></div></div>
        `;
        menuEl.appendChild(row);
      });

      const customerMax = Math.max(...dailyCustomers.map((d) => d.value));
      const customerEl = document.getElementById("customerStats");
      customerEl.className = "vbar-chart";
      dailyCustomers.forEach((day) => {
        const pct = Math.round((day.value / customerMax) * 100);
        const col = document.createElement("div");
        col.className = "vbar-col";
        col.innerHTML = `
          <span class="vbar-value">${day.value}</span>
          <div class="vbar-fill" style="height: ${pct}%"></div>
          <span class="vbar-label">${day.name}</span>
        `;
        customerEl.appendChild(col);
      });
    }

    document.getElementById("addBtn").addEventListener("click", addRestaurant);
    document.getElementById("loadBtn").addEventListener("click", loadRestaurants);

    showAuthState();
    if (accessToken()) loadRestaurants();
    renderFakeStats();
  </script>
</body>
</html>
