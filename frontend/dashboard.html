<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Loyable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --gap: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; color: var(--navy); }
    section {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: var(--gap);
      background: #fff;
    }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #555; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: var(--gap);
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: var(--sage-btn);
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover { background: #8a9d76; }
    button.logout {
      background: #dc2626;
      margin-left: 0;
    }
    button.logout:hover { background: #b91c1c; }
    .auth-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    #status {
      min-height: 1.4em;
      padding: 8px 0;
      font-size: 0.9rem;
    }
    #status.error { color: #dc2626; }
    #status.success { color: #16a34a; }
    ul { padding-left: 20px; }
    li { margin-bottom: 4px; }
    .muted { color: #888; font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-frame has-nav">
      <div class="phone-content">
        <h1>Restaurant Dashboard</h1>
        <p class="page-copy" style="margin-bottom: 16px;">
          <a href="profile.html" style="color: var(--sage-btn); text-decoration: none; font-weight: 600;">← Back to profile</a>
        </p>

        <div id="status" aria-live="polite"></div>
        <p class="muted" id="authState" style="margin-bottom: 12px;">Not logged in.</p>

        <section>
          <h2>Restaurants</h2>
          <label for="restName">Restaurant name</label>
          <input id="restName" type="text" placeholder="e.g. Blue Fig Cafe" />

          <button type="button" onclick="addRestaurant()">Add</button>
          <button type="button" onclick="loadRestaurants()">Load</button>

          <ul id="restList"></ul>
        </section>
      </div>
      <nav class="bottom-nav" aria-label="Main"></nav>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    function accessToken() {
      return localStorage.getItem("accessToken");
    }

    function setStatus(message, isError = false) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = isError ? "error" : "success";
    }

    function showAuthState() {
      const email = localStorage.getItem("email");
      document.getElementById("authState").textContent =
        accessToken() && email
          ? `Logged in as ${email}.`
          : "Not logged in.";
    }

    async function addRestaurant() {
      if (!accessToken()) {
        setStatus("Log in first", true);
        return;
      }
      const name = document.getElementById("restName").value.trim();
      try {
        const res = await fetch(`${API}/restaurants/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken()}`,
          },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(`Added "${data.name}" (id ${data.id}).`);
          document.getElementById("restName").value = "";
          loadRestaurants();
        } else {
          setStatus(data.error || "Could not add restaurant.", true);
        }
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    async function loadRestaurants() {
      if (!accessToken()) {
        setStatus("Log in first", true);
        return;
      }
      try {
        const res = await fetch(`${API}/restaurants/`, {
          method: "GET",
          headers: { "Authorization": `Bearer ${accessToken()}` },
        });
        const data = await res.json();
        if (res.ok) {
          const list = document.getElementById("restList");
          list.textContent = "";
          data.forEach((r) => {
            const li = document.createElement("li");
            li.textContent = `#${r.id} — ${r.name}`;
            list.appendChild(li);
          });
          setStatus(`Loaded ${data.length} restaurant(s).`);
        } else {
          setStatus(data.error || data.msg || "Could not load restaurants.", true);
        }
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    showAuthState();
  </script>
</body>
</html>
